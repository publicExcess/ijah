<text class="t3" x="40" y="300" font-size="11.5">Decode: mean of 6 prompts x 3 seeds (1,024 tokens, T=1, medium thinking), whiskers = 95% CI.</text>
<text class="t3" x="40" y="317" font-size="11.5">Paired on the same prompt and seed: Ijah is 1.162x Sushi (CI 1.122-1.203, 18/18 wins) and 0.94x oMLX (CI 0.92-0.96, 2/18).</text>
<text class="t3" x="40" y="334" font-size="11.5">Prefill: cold prompts with no cache hit, median of 5 runs, whiskers = min-max.</text>
<text class="t3" x="40" y="351" font-size="11.5">One streaming client for all three, each on its own weights and best settings (oMLX: MTP depth 2, INT8-activation prefill).</text>
<text class="t3" x="40" y="368" font-size="11.5">Engine + weights, not engine alone: Sushi ran its 4-bit-expert Sushi-4bpw pack, oMLX the 4.72 bpw oQ4e, Ijah its 5-bit-expert T6 pack.</text>
<text class="t3" x="40" y="385" font-size="11.5">18 Oct 2026, M5 Max 128 GB. Ijah with the DFlash2 drafter measured 120.4 tok/s on a 19 Oct lab build (not in this release).</text>
